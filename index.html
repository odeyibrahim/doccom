<!DOCTYPE html>
<body style="background:#0f0;font-family:sans-serif;padding:20px;text-align:center;">
    <h2>📸 Get Image URL</h2>
    <input type="file" id="file" accept="image/*" />
    <div id="result"></div>
    <script>
        document.getElementById('file').onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('image', file);

            // Upload to ImgBB
            const res = await fetch('https://api.imgbb.com/1/upload', {
                method: 'POST',
                body: formData,
            });

            const data = await res.json();

            if (data.success) {
                document.getElementById('result').innerHTML = `
                    <p>✅ URL: <a href="${data.data.url}" target="_blank">${data.data.url}</a></p>
                    <p>📋 <button onclick="navigator.clipboard.writeText('${data.data.url}')">Copy URL</button></p>
                `;
            } else {
                document.getElementById('result').innerHTML = '❌ Upload failed';
            }
        };
    </script>
</body>
</html>
